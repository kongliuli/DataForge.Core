name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DataForge.Core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore DataForge.Core.sln
      - name: Build
        run: dotnet build DataForge.Core.sln -c Release --no-restore
      - name: Test including PostgreSQL integration
        run: dotnet test DataForge.Core.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Pack without publishing
        run: dotnet pack DataForge.Core.sln -c Release --no-build -o nupkg
      - name: Publish standalone Web folder
        run: dotnet publish tools/DataForge.Web/DataForge.Web.csproj -c Release --no-build -o web-publish
      - name: Verify Web artifact boundaries
        run: |
          test -f web-publish/DataForge.Web.dll
          test -f web-publish/DataForge.Web.runtimeconfig.json
          test -f web-publish/wwwroot/index.html
          test ! -d web-publish/data
      - name: Upload Web host
        uses: actions/upload-artifact@v4
        with:
          name: dataforge-web-net8
          path: DataForge.Core/web-publish/
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DataForge.Core/TestResults/*.trx
          if-no-files-found: warn
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: DataForge.Core/nupkg/*.nupkg
