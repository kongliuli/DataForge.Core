<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DataForge Web</title>
  <style>
    body { font-family: sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 16rem; font-family: ui-monospace, monospace; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>DataForge 迁移</h1>
  <p>源：csv / json / sqlite / postgresql / sqlserver / parquet / duckdb / mysql / excel / http。</p>
  <textarea id="yaml">name: hello
source:
  type: csv
  path: ./input.csv
sink:
  type: json
  path: ./output.json
</textarea>
  <p><button id="run">运行</button></p>
  <pre id="out">等待运行</pre>
  <h2>历史</h2>
  <pre id="history">尚无</pre>
  <script>
    document.getElementById('run').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = '运行中…';
      const res = await fetch('/api/jobs/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ yaml: document.getElementById('yaml').value })
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
      const hist = await fetch('/api/jobs/history');
      document.getElementById('history').textContent = JSON.stringify(await hist.json(), null, 2);
    };
  </script>
</body>
</html>
