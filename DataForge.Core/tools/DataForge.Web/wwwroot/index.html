<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DataForge Local DTS</title>
  <style>
    body { font-family: sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    textarea, input, select { width: 100%; font-family: ui-monospace, monospace; }
    textarea { min-height: 14rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
    section { border: 1px solid #ddd; padding: 1rem; margin: 1rem 0; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    button { margin-right: .5rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>DataForge Local DTS</h1>
  <p>替代 LocalDts：连接档案 + 对象浏览 + YAML 作业运行（SSE 进度）。Catalog：sqlite / postgresql / sqlserver / mysql / excel / parquet / http / duckdb。</p>

  <section>
    <h2>连接档案</h2>
    <label>已保存连接</label>
    <select id="savedConn"></select>
    <button id="loadConn">载入</button>
    <button id="deleteConn">删除</button>
    <div class="row">
      <div>
        <label>名称</label>
        <input id="connName" value="demo-sqlite" />
      </div>
      <div>
        <label>类型</label>
        <select id="connType">
          <option>sqlite</option>
          <option>postgresql</option>
          <option>sqlserver</option>
          <option>mysql</option>
          <option>excel</option>
          <option>parquet</option>
          <option>http</option>
          <option>duckdb</option>
        </select>
      </div>
    </div>
    <label>连接串</label>
    <input id="connString" value="Data Source=./demo.db" />
    <input id="connId" type="hidden" />
    <button id="saveConn">保存连接</button>
    <button id="testConn">探活</button>
    <button id="listTables">列出表</button>
    <pre id="connOut">等待操作</pre>
    <label>表名（结构/预览）</label>
    <input id="tableName" value="orders" />
    <button id="describe">表结构</button>
    <button id="preview">预览</button>
  </section>

  <section>
    <h2>运行作业</h2>
    <textarea id="yaml">name: hello
source:
  type: csv
  path: ./input.csv
sink:
  type: json
  path: ./output.json
</textarea>
    <label>变量（每行 KEY=VALUE，YAML 里用 ${KEY}）</label>
    <textarea id="vars" style="min-height:4rem">SRC=./in.csv
DST=./out.json</textarea>
    <button id="run">运行</button>
    <h3>进度</h3>
    <pre id="progress">等待运行</pre>
    <pre id="out">等待运行</pre>
    <h3>历史</h3>
    <pre id="history">加载中</pre>
  </section>

  <script>
    let connections = [];

    const connPayload = () => {
      const id = document.getElementById('connId').value;
      if (id) return { connectionId: id };
      return {
        type: document.getElementById('connType').value,
        connectionString: document.getElementById('connString').value
      };
    };

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return { ok: res.ok, json: await res.json() };
    }

    async function refreshConnections() {
      const res = await fetch('/api/connections');
      connections = await res.json();
      const sel = document.getElementById('savedConn');
      sel.innerHTML = '<option value="">（新建 / 直接填连接串）</option>' +
        connections.map(c => `<option value="${c.id}">${c.name} [${c.type}]</option>`).join('');
    }

    document.getElementById('loadConn').onclick = () => {
      const id = document.getElementById('savedConn').value;
      const c = connections.find(x => x.id === id);
      if (!c) {
        document.getElementById('connId').value = '';
        return;
      }
      document.getElementById('connId').value = c.id;
      document.getElementById('connName').value = c.name;
      document.getElementById('connType').value = c.type;
      document.getElementById('connString').value = c.connectionString;
      document.getElementById('connOut').textContent = JSON.stringify(c, null, 2);
    };

    document.getElementById('deleteConn').onclick = async () => {
      const id = document.getElementById('savedConn').value || document.getElementById('connId').value;
      if (!id) return;
      await fetch('/api/connections/' + id, { method: 'DELETE' });
      document.getElementById('connId').value = '';
      await refreshConnections();
      document.getElementById('connOut').textContent = '已删除 ' + id;
    };

    document.getElementById('saveConn').onclick = async () => {
      const body = {
        id: document.getElementById('connId').value || '',
        name: document.getElementById('connName').value,
        type: document.getElementById('connType').value,
        connectionString: document.getElementById('connString').value
      };
      const res = await post('/api/connections', body);
      if (res.ok) {
        document.getElementById('connId').value = res.json.id;
        await refreshConnections();
        document.getElementById('savedConn').value = res.json.id;
      }
      document.getElementById('connOut').textContent = JSON.stringify(res.json, null, 2);
    };

    document.getElementById('testConn').onclick = async () => {
      const res = await post('/api/catalog/test', connPayload());
      document.getElementById('connOut').textContent = JSON.stringify(res.json, null, 2);
    };

    document.getElementById('listTables').onclick = async () => {
      const res = await post('/api/catalog/tables', connPayload());
      document.getElementById('connOut').textContent = JSON.stringify(res.json, null, 2);
    };

    document.getElementById('describe').onclick = async () => {
      const res = await post('/api/catalog/describe', { ...connPayload(), table: document.getElementById('tableName').value });
      document.getElementById('connOut').textContent = JSON.stringify(res.json, null, 2);
    };

    document.getElementById('preview').onclick = async () => {
      const res = await post('/api/catalog/preview', { ...connPayload(), table: document.getElementById('tableName').value, limit: 20 });
      document.getElementById('connOut').textContent = JSON.stringify(res.json, null, 2);
    };

    document.getElementById('run').onclick = async () => {
      const out = document.getElementById('out');
      const progress = document.getElementById('progress');
      out.textContent = '运行中…';
      progress.textContent = '';
      const variables = {};
      for (const line of document.getElementById('vars').value.split(/\r?\n/)) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        const eq = trimmed.indexOf('=');
        if (eq <= 0) continue;
        variables[trimmed.slice(0, eq).trim()] = trimmed.slice(eq + 1).trim();
      }
      const res = await fetch('/api/jobs/run/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ yaml: document.getElementById('yaml').value, variables })
      });
      if (!res.ok || !res.body) {
        out.textContent = await res.text();
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';
        for (const block of blocks) {
          const eventLine = block.split('\n').find(line => line.startsWith('event: '));
          const dataLine = block.split('\n').find(line => line.startsWith('data: '));
          if (!dataLine) continue;
          const name = eventLine ? eventLine.slice(7) : 'message';
          const payload = JSON.parse(dataLine.slice(6));
          if (name === 'progress') {
            progress.textContent += JSON.stringify(payload) + '\n';
          } else {
            out.textContent = JSON.stringify(payload, null, 2);
          }
        }
      }
      const hist = await fetch('/api/jobs/history');
      document.getElementById('history').textContent = JSON.stringify(await hist.json(), null, 2);
    };

    refreshConnections();
    fetch('/api/jobs/history').then(r => r.json()).then(j => {
      document.getElementById('history').textContent = JSON.stringify(j, null, 2);
    });
  </script>
</body>
</html>
