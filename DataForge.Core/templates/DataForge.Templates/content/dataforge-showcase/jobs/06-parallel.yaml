name: parallel-batch
execution:
  parallelism: 2
  stopOnError: false
  progressEvery: 500
jobs:
  - name: copy-a
    source:
      type: csv
      path: ../sample.csv
    sink:
      type: json
      path: ../output/a.json
  - name: copy-b
    source:
      type: csv
      path: ../sample.csv
    sink:
      type: json
      path: ../output/b.json
