name: merge-heterogeneous
source:
  type: postgresql
  connection: Host=${PG_HOST};Port=${PG_PORT};Username=${PG_USER};Password=${PG_PASSWORD};Database=${PG_DATABASE}
  table: customer_orders
transforms:
  - select:
      Buyer: Name
      RegionCode: Region
      OrderTotal: Amount
sink:
  type: sqlite
  connection: Data Source=showcase.db
  table: customer_order_summary
  mode: insert
